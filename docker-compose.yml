name: asharasignage

services:
  postgres:
    image: postgres:16-alpine
    container_name: asharasignage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - asharasignage_pgdata:/var/lib/postgresql/data
      - ./db:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: asharasignage-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_PRE_REQUEST: ""
      PGRST_OPENAPI_MODE: ignore-privileges
    ports:
      - "3000:3000"

  web:
    image: asharasignage-web
    container_name: asharasignage-web
    restart: unless-stopped
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_POSTGREST_URL: ${VITE_POSTGREST_URL:-http://localhost:3000}
    depends_on:
      - postgrest
    ports:
      - "8090:80"

volumes:
  asharasignage_pgdata:
